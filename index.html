<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container-3">
        <h2>Rock, Paper, Scissors</h2>
        <p class="subtitle">Pick one to play against the computer</p>

        <div class="scoreboard">
            <div><span>You</span><strong id="human-score">0</strong></div>
            <div><span>Draws</span><strong id="draw-score">0</strong></div>
            <div><span>Computer</span><strong id="bot-score">0</strong></div>
        </div>

        <div class="flex-box-rps" id="flex-box-rps-div">
            <button class="choice" id="rock" onclick="rpsGame(this)">
                <img src="images/rock.svg" alt="">
                <span>Rock</span>
            </button>
            <button class="choice" id="paper" onclick="rpsGame(this)">
                <img src="images/paper.svg" alt="">
                <span>Paper</span>
            </button>
            <button class="choice" id="scissors" onclick="rpsGame(this)">
                <img src="images/scissors.svg" alt="">
                <span>Scissors</span>
            </button>
        </div>

        <div class="result">
            <h1 id="result-message">Make your move!</h1>
            <div class="matchup" id="matchup" hidden>
                <figure>
                    <img id="human-pick" src="" alt="">
                    <figcaption id="human-pick-name"></figcaption>
                </figure>
                <span class="vs">vs</span>
                <figure>
                    <img id="bot-pick" src="" alt="">
                    <figcaption id="bot-pick-name"></figcaption>
                </figure>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset score</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
